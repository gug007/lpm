name: Skills

on:
  pull_request:
    paths:
      - "cli/**"
      - "desktop/frontend/src-tauri/src/aigen.rs"
      - "desktop/frontend/src-tauri/src/skill_install.rs"
      - "lpm/**"
      - "lpm-cli/**"
      - "lpm-config/**"
      - "scripts/check-skills.sh"
      - ".github/workflows/skills.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "desktop/frontend/src-tauri/src/aigen.rs"
      - "desktop/frontend/src-tauri/src/skill_install.rs"
      - "lpm/**"
      - "lpm-cli/**"
      - "lpm-config/**"
      - "scripts/check-skills.sh"
      - ".github/workflows/skills.yml"

jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # The built-in Tailscale sidecar (tailnet/, Go) is built and shipped beside
      # the app, and tauri-build checks it exists like the CLI sidecar.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum

      - uses: dtolnay/rust-toolchain@stable
      - name: Check skills
        run: bash scripts/check-skills.sh
      - name: Test CLI
        run: cargo test --manifest-path cli/Cargo.toml
      - name: Stage CLI sidecar
        # cargo test builds the Tauri crate, whose build script validates the
        # `externalBin` sidecar exists. `tauri build`'s beforeBuildCommand isn't
        # run here, so stage binaries/lpm-cli-<triple> ourselves first.
        run: bash scripts/build-cli.sh
      - name: Stage Tailscale sidecar
        run: node scripts/build-tailnet.mjs
      - name: Test desktop skill integration
        run: |
          cargo test --manifest-path desktop/frontend/src-tauri/Cargo.toml skill_install::tests
          cargo test --manifest-path desktop/frontend/src-tauri/Cargo.toml action_yaml_prompt_tests
