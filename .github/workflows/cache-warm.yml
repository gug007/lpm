name: Warm build cache

# release.yml only runs on tags, and GitHub scopes caches by ref: a cache saved
# by v0.5.3 is invisible to v0.5.4, so every release compiled ~400 crates cold.
# Caches saved here land on the default branch, which tag runs *can* restore
# from — the release then only rebuilds the app crate itself.
on:
  push:
    branches: [main]
    paths:
      - "desktop/frontend/src-tauri/Cargo.toml"
      - "desktop/frontend/src-tauri/Cargo.lock"
      - "cli/Cargo.lock"
      - "desktop/frontend/package-lock.json"
      - "tailnet/go.mod"
      - "tailnet/go.sum"
      - ".github/workflows/cache-warm.yml"
  # A cache goes away after 7 days without a read; releases usually keep it warm,
  # this is the backstop for quiet weeks.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  # One job per release.yml build, on the same runner image, environment and
  # cargo invocation: a key or fingerprint that differs is a cold release build.
  warm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # release.yml passes --target only on macOS, where the x86_64 job
          # cross-builds. An explicit --target changes the output directory and
          # how build scripts are compiled, so it has to match per platform.
          - target: aarch64-apple-darwin
            os: macos-15
            build-args: --target aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-15
            build-args: --target x86_64-apple-darwin
          # build-linux and build-linux-desktop share this one.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      # build-windows' environment. AWS_LC_SYS_PREBUILT_NASM goes through
      # GITHUB_ENV rather than job env because set-but-empty on the other
      # platforms would still differ from release.yml and rebuild aws-lc-sys.
      - name: Match the Windows release environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          "AWS_LC_SYS_PREBUILT_NASM=1" >> $env:GITHUB_ENV
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $perl) { "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV }

      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential curl wget file pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # shared-key must match release.yml's — rust-cache folds the job id into a
      # plain `key`, so `build` and `warm` would never share an entry.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/frontend/src-tauri
            cli
          shared-key: release-${{ matrix.target }}

      - name: Install dependencies
        working-directory: desktop/frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      # beforeBuildCommand builds the built-in Tailscale sidecar (tailnet/, Go).
      # The Go cache saved here is what the release jobs restore, so they hit it
      # and save nothing: a cache saved on a tag is unreadable from the next one.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: |
            tailnet/go.mod
            tailnet/go.sum

      # The Go cache key has no target in it, so both Mac jobs compute the same
      # one and whichever finishes first saves it for both release jobs.
      - name: Build the Tailscale sidecar for both Mac targets
        if: runner.os == 'macOS'
        run: |
          node scripts/build-tailnet.mjs aarch64-apple-darwin
          node scripts/build-tailnet.mjs x86_64-apple-darwin

      # --no-bundle stops after the cargo build: no signing, notarization or
      # packages. LPM_CLI_TARGET pins the sidecar triple the Tauri build script
      # validates. `-- --timings` mirrors release.yml so the cargo arg
      # passthrough is exercised here, on main, rather than first breaking on a tag.
      - name: Build dependencies
        working-directory: desktop/frontend
        env:
          LPM_CLI_TARGET: ${{ matrix.target }}
        run: npx tauri build ${{ matrix.build-args }} --no-bundle -- --timings
