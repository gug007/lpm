name: Release

on:
  push:
    tags:
      - "v*"
  # Publishing is the only time this pipeline runs, so a change to it is otherwise
  # first executed against a real tag — and since `release` needs every build job,
  # one failure there means NOTHING is published, DMGs included. Dispatch lets the
  # build half be exercised first; the publish job is skipped without a tag, so a
  # dry run leaves the artifacts to inspect and creates no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each architecture builds on its own runner so the two Rust release
  # compilations (the bulk of the wall-clock) run in parallel instead of
  # back-to-back on a single machine.
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    env:
      # Tauri's bundler signs the .app with this identity (cert imported below).
      APPLE_SIGNING_IDENTITY: "Developer ID Application: Gurgen Abagyan (N7S7ZCZ5P7)"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restores the dependency build warmed by cache-warm.yml on main. GitHub
      # scopes caches by ref, so a cache saved here (on refs/tags/v*) is
      # unreadable from the next tag — hence save-if: false, and shared-key
      # rather than key: (a plain key folds in the job id, which wouldn't match
      # the warm job's).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/frontend/src-tauri
            cli
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "temp-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp-password" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp-password" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm "$CERT_PATH"

      - name: Store notarization API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Install dependencies
        working-directory: desktop/frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      # `tauri build` signs (APPLE_SIGNING_IDENTITY), then notarizes + staples
      # the .app using the App Store Connect API key, then builds the DMG —
      # replacing the old manual codesign/notarytool/stapler/create-dmg.sh steps.
      # LPM_VERSION is the version the app reports (option_env! at compile time);
      # --config keeps the bundle's CFBundleShortVersionString in sync.
      #
      # The bundled CLI (Contents/MacOS/lpm-cli) is built by beforeBuildCommand
      # (`npm run build:cli`, scripts/build-cli.sh). LPM_CLI_TARGET pins it to the
      # same triple tauri is bundling so the x86_64 job cross-builds the CLI
      # instead of producing a host-arch (arm64) binary; LPM_VERSION flows through
      # so `lpm --version` matches the app. Tauri's macOS bundler code-signs the
      # externalBin alongside the app under the hardened runtime.
      - name: Build, sign & notarize
        working-directory: desktop/frontend
        env:
          LPM_VERSION: ${{ env.VERSION }}
          LPM_CLI_TARGET: ${{ matrix.target }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
        run: |
          npx tauri build --target ${{ matrix.target }} --config "{\"version\":\"$VERSION\"}" -- --timings

      # Per-crate build timings for the run above — open the HTML to see which
      # crates dominate and whether the warm cache actually hit.
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.arch }}
          path: desktop/frontend/src-tauri/target/**/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

      # Tauri notarizes + staples the .app but leaves the DMG itself
      # un-notarized, which can trip Gatekeeper on a manual browser download.
      # (The in-app updater copies the stapled .app from inside, so it's
      # unaffected — this is purely for clean manual-download UX.)
      - name: Notarize & staple DMG
        working-directory: desktop/frontend
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
        run: |
          dmg=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "$dmg"

      # The in-app updater (updates.rs) only matches assets ending in
      # macos-arm64.dmg / macos-amd64.dmg, so rename Tauri's per-arch output.
      - name: Rename DMG to updater asset name
        working-directory: desktop/frontend
        run: |
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg lpm-desktop-macos-${{ matrix.arch }}.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: desktop/frontend/lpm-desktop-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          [ -f "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$RUNNER_TEMP/private_keys"

  # The headless Linux host: the same app, built for a server that runs it under a
  # virtual display with a Mac driving it. Shipped as a tarball of the binary, the
  # CLI, the systemd units and an installer, because there is nothing to click on
  # the far end — without a published asset the only way to get this is a CI
  # artifact off a branch, which is not a thing a user can be told to do.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential curl wget file pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # MUST go through the Tauri CLI, not `cargo build --release`. Asset
      # embedding is driven by the env the CLI sets up for tauri-build, not by the
      # cargo profile: a plain cargo build yields a binary that still points at
      # devUrl and shows "Could not connect to 127.0.0.1" on a machine with no dev
      # server. --no-bundle skips the macOS-only bundle targets.
      - name: Build
        working-directory: desktop/frontend
        env:
          LPM_VERSION: ${{ env.VERSION }}
          LPM_CLI_TARGET: x86_64-unknown-linux-gnu
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx tauri build --no-bundle --config "{\"version\":\"$VERSION\"}"

      # The embedded frontend is the difference between a working binary and one
      # that starts and shows a connection error. Cheap to prove, so prove it.
      - name: Verify the frontend is embedded
        run: |
          count=$(strings desktop/frontend/src-tauri/target/release/lpm-desktop | grep -c '/assets/' || true)
          echo "embedded asset references: $count"
          [ "$count" -gt 100 ] || { echo "binary looks like a plain cargo build" >&2; exit 1; }

      - name: Stage tarball
        run: |
          mkdir -p lpm-host
          cp desktop/frontend/src-tauri/target/release/lpm-desktop lpm-host/
          cp desktop/frontend/src-tauri/binaries/lpm-cli-x86_64-unknown-linux-gnu lpm-host/lpm
          cp desktop/linux/*.service desktop/linux/*.sh desktop/linux/README.md lpm-host/
          chmod +x lpm-host/lpm-desktop lpm-host/lpm lpm-host/install.sh lpm-host/host-cleanup.sh
          tar czf lpm-host-linux-amd64.tar.gz lpm-host
          ls -lh lpm-host-linux-amd64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-host
          path: lpm-host-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Collect the already-notarized DMGs and the Linux tarball and publish them in a
  # single release — one creation, so the parallel build jobs can't race on it.
  release:
    needs: [build, build-linux]
    # Tags only. A dispatch run has no tag for the release to hang off, and
    # gh-release fails rather than skipping — which would paint a successful
    # smoke test red.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/lpm-host-linux-amd64.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
