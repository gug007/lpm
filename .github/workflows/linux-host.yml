name: Linux host

# lpm's UI ships on macOS, but the same binary is meant to run headless on a
# Linux server that a Mac drives over the peer protocol. Nobody develops on
# Linux, so without this job the `#[cfg(not(target_os = "macos"))]` branches are
# only ever typechecked by eye. This compiles and tests them on every push.

on:
  push:
    branches: [main]
    paths:
      - "desktop/frontend/src-tauri/**"
      - "cli/**"
      - ".github/workflows/linux-host.yml"
  pull_request:
    paths:
      - "desktop/frontend/src-tauri/**"
      - "cli/**"
  workflow_dispatch:

concurrency:
  group: linux-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2's Linux backend is WebKitGTK; tmux is load-bearing for the
      # services tests, and iproute2 supplies the `ss` the port probe shells out
      # to on this platform.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential curl wget file pkg-config \
            tmux iproute2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/frontend/src-tauri
            cli

      # The `lpm` CLI is pure Rust with no macOS assumptions, so Linux support is
      # essentially free — but it only stays that way if it is built here.
      - name: Check CLI
        working-directory: cli
        run: |
          cargo check --all-targets
          cargo test

      # tauri-build resolves frontendDist ("../dist") and the CLI sidecar at
      # build-script time, so both must exist before the crate will check.
      - name: Build frontend and CLI sidecar
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build:cli
          npm run build

      - name: Check desktop crate
        working-directory: desktop/frontend/src-tauri
        run: cargo check --all-targets

      # Covers the ss parsers, the vault key-file backend, and every other
      # portable module — the Linux halves that macOS CI can never reach.
      - name: Test desktop crate
        working-directory: desktop/frontend/src-tauri
        run: cargo test --lib
