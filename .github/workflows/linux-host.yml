name: Linux host

# lpm's UI ships on macOS, but the same binary is meant to run headless on a
# Linux server that a Mac drives over the peer protocol. Nobody develops on
# Linux, so without this job the `#[cfg(not(target_os = "macos"))]` branches are
# only ever typechecked by eye. This compiles and tests them on every push.

on:
  push:
    # `linux-**` is an escape hatch for bringing this job up: pushing to such a
    # branch runs it without needing a PR open, and the pattern never matches a
    # normal branch, so there is nothing to remember to remove later.
    branches: [main, "linux-**"]
    paths:
      - "desktop/frontend/src-tauri/**"
      - "cli/**"
      - ".github/workflows/linux-host.yml"
  pull_request:
    paths:
      - "desktop/frontend/src-tauri/**"
      - "cli/**"
      # Iterating on CI means commits that touch ONLY this file. Without it
      # listed here, the re-runs stop firing after the first push.
      - ".github/workflows/linux-host.yml"
  workflow_dispatch:

concurrency:
  group: linux-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tauri 2's Linux backend is WebKitGTK; tmux is load-bearing for the
      # services tests, and iproute2 supplies the `ss` the port probe shells out
      # to on this platform.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential curl wget file pkg-config \
            tmux iproute2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/frontend/src-tauri
            cli

      # The `lpm` CLI is pure Rust with no macOS assumptions, so Linux support is
      # essentially free — but it only stays that way if it is built here.
      - name: Check CLI
        working-directory: cli
        run: |
          cargo check --all-targets
          cargo test

      # tauri-build resolves frontendDist ("../dist") and the CLI sidecar at
      # build-script time, so both must exist before the crate will check.
      - name: Build frontend and CLI sidecar
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build:cli
          npm run build

      - name: Check desktop crate
        working-directory: desktop/frontend/src-tauri
        run: cargo check --all-targets

      # Covers the ss parsers, the vault key-file backend, and every other
      # portable module — the Linux halves that macOS CI can never reach.
      - name: Test desktop crate
        working-directory: desktop/frontend/src-tauri
        run: cargo test --lib

  # A runnable binary for the headless smoke test. Kept out of `check` because
  # it's the slow path (a release link, not a typecheck) and is only needed when
  # someone is about to actually run it on a Linux box.
  binary:
    # head_ref is set only for pull_request events, where ref_name is the
    # useless "<n>/merge"; falling back to ref_name covers the push case.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref || github.ref_name, 'linux-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential curl wget file pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/frontend/src-tauri
          key: release

      # MUST go through the Tauri CLI, not `cargo build --release`. Asset
      # embedding is driven by the env the CLI sets up for tauri-build, NOT by
      # the cargo profile: a plain cargo build yields a binary that still points
      # at devUrl and shows "Could not connect to 127.0.0.1" on a machine with no
      # dev server. --no-bundle skips the macOS-only bundle targets; the CLI runs
      # beforeBuildCommand (frontend + CLI sidecar) itself.
      - name: Build lpm binary
        working-directory: desktop/frontend
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: Stage artifact
        run: |
          mkdir -p out
          cp desktop/frontend/src-tauri/target/release/lpm-desktop out/
          cp desktop/frontend/src-tauri/binaries/lpm-cli-* out/ || true
          chmod +x out/*
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: lpm-linux-x86_64
          path: out/
          retention-days: 14
