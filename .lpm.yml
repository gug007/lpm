services:
  dev:
    cmd: npm run tauri dev
    cwd: ./desktop/frontend/

  website:
    cmd: npm run dev
    cwd: ./website
    port: 3000

profiles:
  dev:
    - dev

actions:
  release:
    label: 🚀 Release · {{git.tag:v*}} · {{git.tagAge:v*}}
    type: background
    cmd: ./scripts/release.sh {{bump}} {{channel}}
    confirm: true
    inputs:
      bump:
        type: radio
        label: What kind of release?
        options:
          - label: Patch — bug fixes ({{git.nextPatch:v*}})
            value: patch
          - label: Minor — new features ({{git.nextMinor:v*}})
            value: minor
          - label: Major — breaking changes ({{git.nextMajor:v*}})
            value: major
        default: patch
        required: true
      channel:
        type: radio
        label: Who gets it?
        options:
          - label: Stable — everyone
            value: stable
          - label: Beta — only apps on the Beta update channel
            value: beta
        default: stable
        required: true
    position: 1
    display: footer

  github-issues:
    label: 'Issues · $(gh api -X GET search/issues -f q="repo:gug007/lpm is:issue is:open -commenter:gug007 -author:gug007" --jq .total_count)'
    emoji: 💬
    cmd: open "https://github.com/gug007/lpm/issues?q=is%3Aissue+is%3Aopen+-commenter%3Agug007+-author%3Agug007"
    type: background
    labelRefresh: 10m
    display: footer
    position: 1

  first-commit-age:
    label: $(./scripts/first-commit-age.sh) ago
    emoji: 🌱
    cmd: open "https://github.com/gug007/lpm/commit/$(git rev-list --max-parents=0 HEAD | tail -1)"
    type: background
    labelRefresh: 24h
    display: footer
    position: 4
