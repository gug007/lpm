<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage</title>
<style>
  :root {
    --text: var(--lpm-text, #1a1a1a); --muted: var(--lpm-muted, #6b6b6b); --bg: var(--lpm-bg, #f5f5f5); --surface: var(--lpm-surface, #fff);
    --soft: color-mix(in srgb, var(--text) 72%, var(--muted)); --edge: color-mix(in srgb, var(--text) 13%, transparent);
    --line: color-mix(in srgb, var(--text) 8%, transparent); --chip: color-mix(in srgb, var(--text) 8%, transparent); --link: #1d4ed8; --raise: #fff; --card: color-mix(in srgb, var(--surface) 55%, var(--bg));
    --macos: #2a78d6; --macos-alt: #86b6ef; --windows: #eb6834; --windows-alt: #f0a17f; --linux: #1a9e6f; --linux-alt: #83cdb0;
    --new: #d0447a; --newest: #6250d6; --had: #8a8a8a; --older: #c4c4c4; --up: #15803d; --down: #c53030; --shade: rgb(0 0 0 / 0.14);
  }
  :root[data-theme="dark"] {
    --link: var(--lpm-accent, #60a5fa); --raise: #3d3d3d; --macos: #3987e5; --macos-alt: #1c5cab; --windows: #d95926; --windows-alt: #8f3a18; --linux: #199e70; --linux-alt: #0f6146;
    --new: #d55181; --newest: #9085e9; --had: #858585; --older: #565656; --up: var(--lpm-green, #4ade80); --down: var(--lpm-red, #f87171); --shade: rgb(0 0 0 / 0.4);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  h2, h3 { margin: 0; font-size: 13px; font-weight: 650; }
  h3 { font-size: 12.5px; }
  main { max-width: 1240px; min-height: min(100vh, 960px); margin: 0 auto; padding: 24px 26px 26px; display: flex; flex-direction: column; gap: 20px; }
  .macos { background: var(--macos); } .macos.alt { background: var(--macos-alt); } .windows { background: var(--windows); } .windows.alt { background: var(--windows-alt); }
  .linux { background: var(--linux); } .linux.alt { background: var(--linux-alt); } .new { background: var(--new); } .newest { background: var(--newest); }
  .had, .prev { background: var(--had); } .older { background: var(--older); }
  .link { color: var(--link); font-size: 12px; font-weight: 550; padding: 3px 0; }
  .link:hover { text-decoration: underline; text-underline-offset: 2px; }

  .hero { display: grid; grid-template-columns: minmax(290px, 1.45fr) 4fr; gap: 20px 28px; align-items: center; }
  .lead { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .big { font-size: 62px; font-weight: 650; letter-spacing: -0.04em; line-height: 0.95; }
  .about { display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; color: var(--muted); }
  .about b { font-size: 15px; font-weight: 650; color: var(--text); line-height: 1.35; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 0; }
  .stat { padding: 0 14px 0 18px; border-left: 1px solid var(--edge); min-width: 0; }
  .stat h3 { font-size: 12px; font-weight: 600; color: var(--soft); }
  .stat .value { font-size: 27px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.25; }
  .stat .note { font-size: 12px; color: var(--muted); text-wrap: balance; }
  .change { font-weight: 650; margin-right: 5px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .early { display: flex; gap: 10px; padding: 9px 13px; border: 1px solid var(--edge); border-radius: 10px; background: var(--card); font-size: 12.5px; color: var(--soft); }
  .early::before { content: "i"; flex: none; width: 15px; height: 15px; margin-top: 2px; border: 1.5px solid currentColor; border-radius: 50%; font: 700 10px/12.5px ui-serif, Georgia, serif; text-align: center; opacity: 0.75; }

  .board { flex: 1 0 auto; display: grid; grid-template-columns: minmax(0, 1.95fr) minmax(310px, 1fr); border: 1px solid var(--edge); border-radius: 12px; background: var(--card); }
  .time, .who { min-width: 0; padding: 16px 18px 18px; display: flex; flex-direction: column; }
  .who { border-left: 1px solid var(--edge); padding-bottom: 6px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 28px; }
  .bar .label { font-size: 12px; color: var(--muted); } .bar > .label { margin-left: auto; }
  .group { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .segs { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--chip); }
  .segs button { padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; line-height: 18px; color: var(--muted); }
  .segs button:hover { color: var(--text); }
  .segs button[aria-pressed="true"] { color: var(--text); background: var(--raise); box-shadow: 0 1px 2px rgb(0 0 0 / 0.18); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .key { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; } .key > i { align-self: center; }
  .key b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  .key.end { margin-left: auto; }
  .sw { flex: none; width: 10px; height: 10px; border-radius: 3px; }

  .chart { position: relative; flex: 1; display: flex; flex-direction: column; padding: 26px 4px 0 34px; }
  .plot, .ticks, .strip, .minis { position: relative; z-index: 1; pointer-events: none; }
  .plot { flex: 1 0 auto; min-height: 210px; }
  .grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); } .grid:first-child { border-color: var(--edge); }
  .grid span { position: absolute; right: 100%; top: -8px; margin-right: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cols { display: flex; } .plot .cols { position: absolute; inset: 0; }
  .cols > * { position: relative; flex: 1 1 0; min-width: 0; display: flex; justify-content: center; align-items: flex-end; }
  .stack { position: relative; width: calc(100% - max(2px, 22%)); max-width: 34px; display: flex; flex-direction: column-reverse; gap: 2px; }
  .stack i { display: block; min-height: 1px; flex-basis: 0; }
  .stack i:last-of-type { border-radius: var(--round, 4px) var(--round, 4px) 0 0; }
  .many .stack { --round: 3px; gap: 1px; } .thin-cols .stack { --round: 1.5px; }
  .cap { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); padding-bottom: 3px; font-size: 12px; font-weight: 650; white-space: nowrap; }
  .ticks { height: 42px; font-size: 11px; color: var(--muted); } .many .ticks { height: 30px; }
  .ticks > * { align-items: flex-start; }
  .tick { position: absolute; top: 7px; white-space: nowrap; text-align: center; line-height: 16px; }
  .many .ticks > :last-child .tick { right: 0; }
  .tick small { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px; }
  .dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--newest); } .ticks > * > .dot { position: absolute; top: 28px; } .many .ticks > * > .dot { top: 3px; width: 3px; height: 3px; }
  .on .tick, .on .cap { color: var(--text); } .on .tick { font-weight: 600; } .on .tick small { font-weight: 400; color: var(--muted); }
  .future { opacity: 0.7; }
  .strip { margin: 0 -4px 0 -34px; border-top: 1px solid var(--line); padding: 9px 0 0; display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  .strip span { color: var(--muted); }
  .minis { height: 58px; padding-top: 22px; margin-bottom: 11px; } .chart > .minis:last-of-type { margin-bottom: 0; }
  .many .minis { height: 46px; padding-top: 8px; }
  .minis .stack { height: 100%; justify-content: flex-start; } .minis .track { background: var(--chip); border-radius: var(--round, 4px) var(--round, 4px) 0 0; }
  .minis .stack i { flex: none; } .minis .cap { font-size: 11px; font-weight: 400; color: var(--muted); } .minis .on .cap { font-weight: 650; }
  .hits { position: absolute; inset: 6px 4px 0 34px; }
  .hits button { align-self: stretch; } .hits button:focus-visible { outline: 0; }
  .hits button::before { content: ""; align-self: stretch; flex: 0 1 104px; border-radius: min(8px, var(--round, 8px)); }
  .hits button:hover::before { background: color-mix(in srgb, var(--text) 4%, transparent); } .hits button[aria-pressed="true"]::before { background: color-mix(in srgb, var(--text) 7%, transparent); }
  .many .hits { --round: 3px; } .thin-cols .hits button[aria-pressed="true"]::before { background: color-mix(in srgb, var(--text) 13%, transparent); }
  .hits button:focus-visible::before { outline: 2px solid var(--link); outline-offset: -2px; }
  .tip { position: absolute; top: 14px; z-index: 3; pointer-events: none; min-width: 146px; padding: 9px 12px 10px; background: var(--surface); border: 1px solid var(--edge); border-radius: 9px; box-shadow: 0 8px 24px var(--shade); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tip strong { display: block; font-size: 17px; font-weight: 650; color: var(--text); line-height: 1.35; }
  .tip .key { display: flex; margin-top: 2px; } .tip .key b { min-width: 22px; text-align: right; } .tip p { margin: 6px 0 0; padding-top: 6px; border-top: 1px solid var(--line); }

  .sections { flex: 1; display: flex; flex-direction: column; margin-top: 12px; } .section.fill { flex: 1; display: flex; flex-direction: column; }
  .section { border-top: 1px solid var(--line); padding: 13px 0 14px; min-width: 0; }
  .section header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .section header span, .aside { font-size: 12px; color: var(--muted); }
  .thin { display: flex; gap: 2px; height: 8px; margin-bottom: 7px; border-radius: 4px; overflow: hidden; } .thin i { flex-basis: 0; min-width: 2px; }
  .row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 40px; align-items: center; gap: 8px; padding: 2.5px 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row b { font-weight: 650; } .row span:last-child { text-align: right; color: var(--muted); }
  .tag { margin-left: 8px; padding: 1px 7px; border: 1px solid var(--edge); border-radius: 99px; font-size: 11px; color: var(--soft); }
  .aside { padding-top: 5px; }
  .months { flex: 1; min-height: 104px; max-height: 220px; gap: 3px; } .months > * { flex-direction: column; align-items: center; justify-content: flex-end; font-size: 11px; }
  .months b { font-size: 11.5px; font-weight: 650; min-height: 17px; } .months i { flex: 0 1 auto; width: 100%; max-width: 26px; border-radius: 4px 4px 0 0; }
  .months span { width: 100%; border-top: 1px solid var(--edge); padding-top: 4px; text-align: center; color: var(--muted); font-size: 10.5px; white-space: nowrap; }
  .stay { display: grid; gap: 2px; font-size: 12px; font-variant-numeric: tabular-nums; } .stay span { padding: 3px 0; border-radius: 4px; text-align: center; min-width: 0; }
  .stay .head { font-size: 11px; color: var(--muted); } .stay .now { color: var(--text); font-weight: 600; } .stay .name { text-align: left; color: var(--soft); white-space: nowrap; }

  .table { flex: 1 1 0; min-height: 420px; overflow: auto; margin: 12px -8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); } th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-size: 12px; font-weight: 600; }
  td.sum { font-weight: 650; } tr.on td, tbody tr:hover td { background: color-mix(in srgb, var(--text) 5%, transparent); } tbody tr { cursor: pointer; } td .link { color: var(--text); font-size: inherit; } td small { font-size: 11px; color: var(--muted); margin-left: 6px; }

  .message { max-width: 620px; padding: 18px 20px; border: 1px solid var(--edge); border-radius: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .message b { font-size: 15px; font-weight: 650; color: var(--text); }
  .message code { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--soft); background: var(--chip); border-radius: 6px; padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }

  .popup main { padding: 0; gap: 0; height: 100vh; min-height: 0; } .popup button:focus-visible { outline-offset: -2px; }
  .tabs { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: var(--chip); }
  .tabs button { height: 48px; padding: 0 9px; border-radius: 7px; text-align: left; font-size: 11.5px; line-height: 16px; color: color-mix(in srgb, var(--text) 25%, var(--muted)); white-space: nowrap; overflow: hidden; }
  .tabs b { display: block; font-size: 19px; font-weight: 650; letter-spacing: -0.02em; line-height: 24px; color: var(--soft); }
  .tabs button:hover b, .tabs [aria-pressed="true"] b { color: var(--text); } .tabs [aria-pressed="true"] { color: var(--soft); background: var(--bg); box-shadow: 0 1px 3px var(--shade); }
  .said { flex: none; display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 0 2px; font-size: 12px; line-height: 18px; color: var(--soft); white-space: nowrap; }
  .said > :first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .said .change { margin: 0; } .said .key { color: var(--muted); }
  .popup .chart { min-height: 0; padding: 20px 0 0; } .popup .plot { min-height: 0; } .popup .ticks { height: 22px; } .popup .tick { top: 4px; } .popup .many .ticks > :first-child .tick { left: 0; } .popup .hits { inset: 0; } .popup .hits button { cursor: default; } .popup .hits button:hover::before { background: none; }
  .popup .had { background: var(--macos); } .popup .stack { max-width: 24px; opacity: 0.76; } .popup .on .stack { opacity: 1; } .popup .pointing .plot > .cols > :not(.on) .stack { opacity: 0.5; }
  .popup .cap { font-size: 11.5px; padding-bottom: 2px; line-height: 16px; }
  .popup .thin-cols .cols > :nth-child(-n + 2) .cap { left: 0; transform: none; } .popup .thin-cols .cols > :nth-last-child(-n + 2) .cap { left: auto; right: 0; transform: none; }
  html:not(.popup) body { min-width: 300px; }
  @media (max-width: 350px) { .tabs button { padding: 0 6px; font-size: 11px; } }
  @media (max-width: 1140px) { .hero { grid-template-columns: 1fr; } .stat:first-child { padding-left: 0; border: 0; } }
  @media (min-width: 941px) and (max-width: 1140px) { .group .label { display: none; } }
  @media (max-width: 940px) {
    .board { flex: none; grid-template-columns: minmax(0, 1fr); } .plot { min-height: 230px; } .table { max-height: 520px; flex: none; }
    .who { border-left: 0; border-top: 1px solid var(--edge); } .sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; } .section:last-child { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    main { padding: 18px 14px 24px; } .time, .who { padding-left: 13px; padding-right: 13px; } .sections { grid-template-columns: minmax(0, 1fr); } .group { width: 100%; flex-wrap: wrap; } .group .link { margin-left: auto; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat:nth-child(odd) { padding-left: 0; border: 0; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const RANGES = { days: "Days", weeks: "Weeks", months: "Months" };
  const BACK = { days: "Back to today", weeks: "Back to this week", months: "Back to this month" };
  const SPLITS = { platform: "Platform", fresh: "New", version: "Version" };
  const TABS = [["days", "Today", "today"], ["weeks", "This week", "week"], ["months", "This month", "month"], ["installs", "New, 7 days", "installs"]];
  const app = document.getElementById("app");
  const root = document.documentElement;
  const state = { range: "days", split: "platform", at: "", table: false, tab: "days" };
  let plotWidth = 600;
  let data = null;

  function h(tag, props, ...kids) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(typeof props === "string" ? { class: props } : props)) {
      if (name.startsWith("on")) node[name] = value;
      else if (value != null && value !== false) node.setAttribute(name, value);
    }
    node.append(...kids.flat().filter((kid) => kid != null && kid !== false && kid !== ""));
    return node;
  }
  const fmt = (n) => Number(n).toLocaleString("en-US");
  const short = (n) => (n < 1000 ? n : n / 1000 + "K");
  const pct = (part, whole) => (!whole ? "–" : part && part / whole < 0.01 ? "<1%" : Math.round((part / whole) * 100) + "%");
  const share = (p) => (p.share == null ? "–" : pct(p.share, 1));
  const sum = (list, f) => list.reduce((all, x) => all + f(x), 0);
  const button = (name, pressed, onclick) => h("button", { type: "button", "aria-pressed": String(pressed), onclick }, name);
  const link = (name, onclick) => h("button", { type: "button", class: "link", onclick }, name);
  const computers = (n) => (n === 1 ? "computer" : "computers");
  const newInstalls = (n) => fmt(n) + (n === 1 ? " new install" : " new installs");
  const percent = (change) => h("span", "change " + (change.percent > 0 ? "up" : change.percent < 0 ? "down" : ""), (change.percent > 0 ? "+" : change.percent < 0 ? "−" : "") + fmt(Math.abs(change.percent)) + "%");
  const set = (change) => { Object.assign(state, change); render(); };

  // What a period's column is made of, bottom first.
  function parts(p, split) {
    if (split === "installs") return [["new", "New installs", p.installs]];
    if (split === "fresh") return [["had", "Had lpm already", p.total - p.installs], ["new", "New installs", p.installs]];
    if (split === "version") {
      const on = (kind) => sum(p.versions.filter((v) => v.kind === kind), (v) => v.n);
      return [["newest", "Newest release", on("newest")], ["prev", "One before", on("prev")], ["older", "Older", on("older")]];
    }
    return [["macos", "macOS", p.os.macos], ["windows", "Windows", p.os.windows], ["linux", "Linux", p.os.linux]];
  }

  function scale(max) {
    const raw = Math.max(1, max) / 4, size = 10 ** Math.floor(Math.log10(raw) + 1e-9);
    const step = Math.max(1, [1, 2, 5, 10].find((n) => n >= raw / size) * size);
    return { step, top: step * Math.max(1, Math.ceil(max / step)) };
  }

  const key = ([kind, name, n], numberFirst) => h("span", "key", h("i", "sw " + kind), numberFirst ? [h("b", "", fmt(n)), name] : [name + " ", h("b", "", fmt(n))]);

  function release(p, long) {
    if (!p.released.length) return "";
    return p.released.length === 1 ? "v" + p.released[0] + (long ? " released" : "") : p.released.length + " releases";
  }

  function tip(p, split) {
    const extra = [p.installs && split !== "fresh" ? fmt(p.installs) + " new" : "", p.servers ? fmt(p.servers) + (p.servers === 1 ? " server" : " servers") : "", release(p, true)].filter(Boolean);
    return [p.title + (p.note ? ", " + p.note : ""), h("strong", "", fmt(p.total)), parts(p, split).filter((part) => part[2]).map((part) => key(part, true)), extra.length > 0 && h("p", "", extra.join(" · "))];
  }

  // Columns that share one row of days: how many computers, then the strips
  // under them. Each column is one button from the top of the chart to its foot.
  // With `point`, the column under the pointer is handed to it instead of a tip.
  function chart(list, { split, at, pick, point, ahead = [], strips = [], axis, days }) {
    const n = list.length + ahead.length, wide = plotWidth / n, many = wide < 34;
    const size = (p) => sum(parts(p, split), (part) => part[2]);
    const max = Math.max(...list.map(size)), { step, top } = axis ? scale(max) : { step: 0, top: Math.max(1, max) };
    const last = list.length - 1, peak = list.findIndex((p) => size(p) === max);
    const terse = days && wide >= 34 && wide < 46, every = terse ? 1 : (days ? [1, 2, 7, 14, 28, 56] : [1, 2, 3, 4, 6]).find((k) => k * wide >= (many ? 52 : 46));
    const brief = (name) => (terse ? name.split(" ")[0] : name);
    const col = (p, ...kids) => h("div", p === at ? "on" : "", ...kids);
    const empty = () => ahead.map(() => h("div", ""));
    const cols = list.map((p, i) => {
      const live = parts(p, split).filter((part) => part[2] > 0);
      const cap = wide >= 26 || i === peak;
      return col(p, h("div", { class: "stack", style: `height:${(size(p) / top) * 100}%` },
        live.map(([kind, , count]) => h("i", { class: kind, style: `flex-grow:${count}` })), cap && h("span", "cap", fmt(size(p)))));
    });
    const ticks = list.map((p, i) => col(p, (last - i) % every === 0 && i * wide + wide / 2 >= (i ? 12 : 0) && h("div", "tick", every < 7 || i === last ? brief(p.tick) : p.day,
      axis && wide >= 58 && (p.released.length ? h("small", "", h("i", "dot"), release(p)) : p.current && h("small", "", "so far"))), axis && wide < 58 && p.released.length > 0 && h("i", "dot")));
    const mark = (p) => {
      box.classList.toggle("pointing", !!p);
      for (const row of box.querySelectorAll(".plot > .cols, .ticks")) [...row.children].forEach((node, i) => node.classList.toggle("on", list[i] === (p ?? at)));
      point(p);
    };
    const show = (p, i) => {
      const x = (i + 0.5) * wide, gap = Math.min(26, wide / 2) + 8;
      hide();
      box.append(h("div", { class: "tip", style: x > (n * wide) / 2 ? `right:${n * wide - x + gap + 4}px` : `left:${34 + x + gap}px` }, ...tip(p, split).flat()));
    };
    const hide = () => (point ? mark() : box.querySelector(".tip")?.remove());
    const hits = h("div", { class: "cols hits", role: "group", "aria-label": "Pick a period", onpointerleave: hide },
      list.map((p, i) => h("button", {
        type: "button", tabindex: p === at ? 0 : -1, "aria-pressed": axis ? String(p === at) : null,
        "aria-label": `${p.title}${p.note ? ", " + p.note : ""}: ${split === "installs" ? newInstalls(p.installs) : fmt(p.total) + " " + computers(p.total)}`,
        onclick: () => (point ? mark(p) : pick(p)), onpointerenter: (event) => event.pointerType === "mouse" && (point ? mark(p) : show(p, i)),
        onfocus: point && (() => mark(p)), onblur: point && (() => mark()),
      })), empty());
    hits.onkeydown = (event) => {
      const i = point ? [...hits.children].indexOf(event.target) : list.indexOf(at), to = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: last }[event.key];
      if (to == null) return;
      event.preventDefault();
      const next = Math.max(0, Math.min(last, to));
      if (point) return hits.children[next].focus();
      pick(list[next]);
      app.querySelector('.hits [tabindex="0"]').focus();
    };
    const box = h("div", "chart" + (many ? " many" : "") + (wide < 16 ? " thin-cols" : ""),
      h("div", "plot",
        axis ? Array.from({ length: top / step + 1 }, (_, i) => h("div", { class: "grid", style: `bottom:${(i * step * 100) / top}%` }, h("span", "", short(i * step)))) : h("div", { class: "grid", style: "bottom:0%" }),
        h("div", "cols", cols, empty())),
      h("div", "cols ticks", ticks, ahead.map((name) => h("div", "future", !many && h("div", "tick", brief(name))))),
      strips.map(({ name, said, kind, full, value, text }) => {
        const most = full ?? Math.max(1, ...list.map(value));
        return [
          h("div", "strip", h("h3", "", name), said && h("span", "", said)),
          h("div", "cols minis", list.map((p) => col(p, h("div", "stack" + (full ? " track" : ""), value(p) > 0 && h("i", { class: kind, style: `height:${(value(p) / most) * 100}%` }),
            !many && h("span", { class: "cap", style: full ? "" : `bottom:${(value(p) / most) * 100}%` }, text(p))))), empty()),
        ];
      }).flat(),
      hits);
    return box;
  }

  function stat(name, value, note, change) {
    return h("div", "stat", h("h3", "", name), h("div", "value", value),
      note && h("div", { class: "note", title: change?.title }, change && percent(change), note));
  }

  function hero(f) {
    const fresh = f.today.installs === 0 ? "no new installs yet" : f.today.installs === 1 ? "1 of them a new install" : fmt(f.today.installs) + " of them new installs";
    return h("section", { class: "hero", "aria-label": "Headline numbers" },
      h("div", "lead", h("span", "big", fmt(f.today.n)), h("div", "about", h("b", "", computers(f.today.n) + " today"), h("span", "", f.today.note), h("span", "", fresh))),
      h("div", "stats",
        stat("This week", fmt(f.week.n), f.week.note, f.week.change), stat("This month", fmt(f.month.n), f.month.note, f.month.change),
        stat("New installs, 7 days", fmt(f.installs.n), f.installs.note, f.installs.change), stat("On the newest release", share(f.newest), f.newest.note)));
  }

  function table(list, at) {
    const row = (p) => h("tr", { class: p === at ? "on" : "", onclick: () => set({ at: p.key }) },
      h("td", "", link(p.title, null), p.note && h("small", "", p.note)), ["macos", "windows", "linux"].map((os) => h("td", "", fmt(p.os[os]))),
      h("td", "sum", fmt(p.total)), [fmt(p.installs), share(p), fmt(p.servers)].map((value) => h("td", "", value)));
    return h("div", "table", h("table", {},
      h("thead", {}, h("tr", {}, [RANGES[state.range].slice(0, -1), "macOS", "Windows", "Linux", "Total", "New", "On newest", "Servers"].map((name) => h("th", { scope: "col" }, name)))),
      h("tbody", {}, list.slice().reverse().map(row))));
  }

  function time(list, at) {
    const { range, split } = state, chosen = range !== "days" && split === "version" ? "platform" : split;
    const ahead = data.ahead[range].slice(0, Math.max(0, data.slots[range] - list.length)), wide = plotWidth / (list.length + ahead.length);
    return h("section", { class: "time", "aria-label": "Computers over time" },
      h("div", "bar", h("h2", "", "Desktop computers"),
        h("span", { class: "segs", role: "group", "aria-label": "Period" }, Object.entries(RANGES).map(([id, name]) => button(name, id === range, () => set({ range: id, at: "" })))),
        h("div", "group",
          !state.table && [h("span", "label", "Color by"), h("span", { class: "segs", role: "group", "aria-label": "Color by" },
            Object.entries(SPLITS).filter(([id]) => id !== "version" || range === "days").map(([id, name]) => button(name, id === chosen, () => set({ split: id }))))],
          link(state.table ? "Chart" : "Table", () => set({ table: !state.table })))),
      state.table ? table(list, at) : [
        h("div", "legend", parts(at, chosen).map((part) => key(part)), wide < 58 && list.some((p) => p.released.length) && h("span", "key end", h("i", "dot"), "release")),
        chart(list, {
          split: chosen, at, ahead, axis: true, days: range === "days", pick: (p) => set({ at: p.key }),
          strips: [
            { name: "New installs", said: wide < 34 && fmt(at.installs), kind: "new", value: (p) => p.installs, text: (p) => fmt(p.installs) },
            { name: "On the newest release", said: at.share == null ? "" : `${share(at)} on v${at.newest}${at.versionsDay ? ", " + at.versionsDay : ""}`, kind: "newest", full: 1, value: (p) => p.share ?? 0, text: share },
          ],
        }),
      ]);
  }

  function section(title, note, ...kids) {
    return h("div", "section" + (kids[0]?.classList.contains("months") ? " fill" : ""), h("header", "", h("h3", "", title), note && h("span", "", note)), ...kids);
  }

  function shares(rows) {
    const whole = sum(rows, (row) => row.n);
    return [
      h("div", { class: "thin", "aria-hidden": "true" }, rows.filter((row) => row.n).map((row) => h("i", { class: row.kind, style: `flex-grow:${row.n}` }))),
      rows.map((row) => h("div", "row", h("i", "sw " + row.kind), h("span", { class: "name", title: row.name }, row.name, row.newest && h("span", "tag", "newest")), h("b", "", fmt(row.n)), h("span", "", pct(row.n, whole)))),
    ].flat();
  }

  function installMonths(rows) {
    const max = Math.max(1, ...rows.map((row) => row.n));
    return h("div", "cols months", rows.map((row) => h("div", { title: `${row.full}: ${fmt(row.n)}` }, h("b", "", row.n ? fmt(row.n) : ""), row.n > 0 && h("i", { class: row.kind, style: `height:max(2px, calc((100% - 38px) * ${(row.n / max).toFixed(3)}))` }), h("span", "", row.name))));
  }

  function stay({ months, rows }, at) {
    const max = Math.max(1, ...rows.flatMap((row) => row.cells));
    return h("div", { class: "stay", style: `grid-template-columns:54px repeat(${months.length}, minmax(0, 1fr))` },
      h("span", ""), months.map((m) => h("span", { class: "head" + (m.key === at.key ? " now" : ""), title: m.note }, m.name)),
      rows.flatMap((row) => [h("span", "name", row.name), ...row.cells.map((n) => h("span", { style: n == null ? "" : `background:color-mix(in srgb, var(--had) ${Math.round(8 + (n / max) * 58)}%, transparent)` }, n == null ? "" : fmt(n)))]));
  }

  function who(p) {
    const around = state.range === "months" && data.stay.months.length > 1;
    return h("section", { class: "who", "aria-label": "Who they are" },
      h("div", "bar", h("h2", "", p.title), !p.current && link(BACK[state.range], () => set({ at: "" })), h("span", "label", `${fmt(p.total)} ${computers(p.total)}`)),
      h("div", "sections",
        p.versions.length > 0 && section("Version", p.versionsDay && "on " + p.versionsDay, ...shares(p.versions)),
        section("Platform", "", ...(p.total ? shares(p.platforms) : []), p.servers > 0 && h("div", "aside", `${fmt(p.servers)} ${p.servers === 1 ? "server" : "servers"}, counted apart`)),
        around ? section("Who is still around", "by month installed", stay(data.stay, p)) : section("Month they installed lpm", "", installMonths(p.cohorts))));
  }

  function message(title, detail, ...kids) {
    app.replaceChildren(h("div", "message", h("b", "", title), h("span", "", detail), ...kids));
  }

  // The button's hover card: four numbers that pick what the columns count.
  function popup() {
    const { tab } = state, fresh = tab === "installs", range = fresh ? "days" : tab, list = data[range].slice(-30);
    const line = h("span", ""), { text, change } = data.compared?.[tab] ?? {};
    const say = (p) => line.replaceChildren(...(p ? [`${p.title}: ${fresh ? "" : `${fmt(p.total)} ${computers(p.total)}, `}${newInstalls(p.installs)}`]
      : [text ?? "", ...(change ? [" · ", percent(change), " vs same days"] : [])]));
    const pick = (id) => (event) => {
      set({ tab: id });
      if (!event.detail) app.querySelector('.tabs [aria-pressed="true"]').focus();
    };
    say();
    plotWidth = app.clientWidth || 380;
    app.replaceChildren(
      h("div", { class: "tabs", role: "group", "aria-label": "What the chart counts" }, TABS.map(([id, name, figure]) =>
        h("button", { type: "button", "aria-pressed": String(id === tab), onclick: pick(id) }, name, h("b", "", fmt(data.figures[figure].n))))),
      h("div", "said", line, h("span", "key", h("i", "sw new"), "new")),
      chart(list, { split: fresh ? "installs" : "fresh", at: list.at(-1), point: say, ahead: data.ahead[range].slice(0, Math.max(0, data.slots[range] - list.length)), days: range === "days" }));
  }

  function tab() {
    const fits = Math.max(data.slots.days, Math.floor(plotWidth / 7));
    const list = state.range === "days" ? data.days.slice(-fits) : data[state.range];
    const at = list.find((p) => p.key === state.at) ?? list.at(-1), f = data.figures;
    app.replaceChildren(...[hero(f), f.early && h("div", "early", f.early), h("div", "board", time(list, at), who(at))].filter(Boolean));
    const plot = app.querySelector(".plot");
    if (plot && Math.abs(plot.clientWidth - plotWidth) > 4) { plotWidth = plot.clientWidth; tab(); }
  }

  function render() {
    data = window.lpm && lpm.data;
    if (!data || typeof data.since !== "string") {
      const signIn = /wrangler login/.test((window.lpm && lpm.error) || "");
      return message("Couldn’t read the numbers", signIn ? "The database asked to sign in again. Run this in the ping folder, then try again:" : "The ping database didn’t answer.",
        signIn ? h("code", "", "npx wrangler login") : window.lpm && (lpm.error || lpm.text) && h("code", "", lpm.error || lpm.text), window.lpm && lpm.refresh && link("Try again", () => lpm.refresh()));
    }
    if (!data.since) return message("No computers counted yet", "The first numbers come in after a release with the daily ping. Each computer that runs it counts once a day.");
    if (root.classList.contains("popup")) popup(); else tab();
  }

  root.setAttribute("data-theme", window.lpm && lpm.theme && lpm.theme.mode === "light" ? "light" : "dark");
  root.classList.toggle("popup", !!window.lpm && lpm.view !== "tab");
  render();
  if (window.lpm) lpm.onData(render);
  let lastWidth = app.clientWidth;
  new ResizeObserver(() => {
    if (Math.abs(app.clientWidth - lastWidth) <= 4) return;
    lastWidth = app.clientWidth;
    render();
  }).observe(app);
</script>
</body>
</html>
