[package]
name = "lpm-desktop"
version = "0.0.1"
description = "lpm — Local Project Manager"
edition = "2021"
rust-version = "1.85"

# Tauri 2 convention: a lib crate (the app logic) plus a thin main.rs binary.
# rlib only: main.rs is the sole consumer. Tauri's template also emits staticlib
# (iOS) and cdylib (Android), and cargo builds every declared crate-type — three
# full codegen + LTO passes over this crate on a desktop-only build.
[lib]
name = "lpm_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = ["unstable"] }  # unstable = multiwebview (in-pane browser)
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"
portable-pty = "0.9"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
notify = "8"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
base64 = "0.22"
urlencoding = "2"
glob = "0.3"
libc = "0.2"
regex = "1"           # sniff localhost URLs from remote PTY output (port poller)
toml_edit = "0.25"

# --- Notes + vault (encrypted notes.db, blob store, Keychain, key export) ---
# SQLCipher 4.x compiled from source with vendored OpenSSL so the build is
# self-contained (no Homebrew openssl / OPENSSL_DIR). On-disk format is crypto-
# provider-independent, so it reads files written by Go's go-sqlcipher/v4.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
aes-gcm = "0.11"        # AES-256-GCM blob + export AEAD (ct||tag, 12B nonce)
argon2 = "0.5"          # Argon2id KEK for vault key export/import
sha2 = "0.11"           # blob content addressing
getrandom = "0.4"       # key / salt / nonce CSPRNG
zeroize = "1"           # wipe key buffers
tempfile = "3"          # atomic blob temp-then-rename
chrono = "0.4"         # vault-export filename timestamp (local time)
mime_guess = "2"       # attachment MIME from extension
tar = "0.4"            # config export/import archive
flate2 = "1"           # gzip for the config archive
# Blocking HTTP for the self-updater and the push relay. The TLS backend is
# per-target (see the two target sections below): native-tls on macOS resolves to
# Security.framework, but on Linux it would resolve to OpenSSL and drag in a
# libssl-dev build requirement, so that target uses rustls — already vendored
# here for peertls/remotetls.

# --- Mobile remote-control server (remote.rs) ---
# Blocking WebSocket per the socketsrv std::thread house style (no tokio). Each
# phone connection is one thread; output is teed from the PTY flush point.
tungstenite = "0.30"
# QR encode the pairing payload to an SVG string the Settings pane renders inline
# (svg feature only — avoids pulling the `image` crate).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Bonjour/mDNS advertising so the phone can discover this Mac on the LAN and
# recover a saved server whose IP changed. Runs its own daemon thread (no tokio),
# coexisting with the blocking tungstenite server.
mdns-sd = "0.20"
# wss:// transport for the remote server (remotetls.rs). A self-signed, pinned
# leaf (ECDSA P-256, CN "lpm") the phone trusts on first pair/auth. rustls uses
# the aws-lc-rs provider already in the tree; rcgen mints the cert; rustls-pemfile
# parses the persisted PEM on load.
rustls = "0.23"
rcgen = "0.13"
rustls-pemfile = "2"
time = "0.3"

# objc2 for the in-pane browser's per-webview NSAppearance override (window theme
# is app-wide on macOS). Versions match what Tauri already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
# macOS Keychain (legacy login keychain, generic password), used only by
# vaultkeychain.rs. Raw SecItem FFI: kSec* constants + errSec codes from -sys,
# core-foundation to build the query dictionaries. We mirror go-keychain's exact
# attributes (SynchronizableAny on read) so the existing vault key is found,
# never recreated. Other platforms store the key via vaultkeyfile.rs instead.
security-framework-sys = "2.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }

# Linux host build. No Security.framework, so TLS comes from rustls rather than
# OpenSSL — keeps the build free of libssl-dev on minimal server images.
[target.'cfg(not(target_os = "macos"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

# Every rebuild orphans its object files (content-hashed names) and cargo never
# reclaims them. Coarser codegen units cut that leak from ~261 files per edit to
# ~69, and line tables give us backtraces at ~25% less disk — both measured to
# leave incremental rebuilds at ~2s. Growth is only slowed, not stopped;
# scripts/check-build-cache.sh is what actually bounds it.
[profile.dev]
codegen-units = 64
debug = "line-tables-only"

# thin LTO + parallel codegen roughly halves CI link time; the runtime
# difference is imperceptible for a GUI app. opt-level = "s" keeps DMG size down.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
