appId: cx.lpm.mobile
name: 35-usage-row-detail
tags: [demo, usage]
---
- runFlow: subflows/enter-demo.yaml
# A usage row reads out its account and tag ("Work, pool"); tapping it opens
# both of its windows, which the desktop shows on hover. The row comes to the
# middle first: at the foot of the screen its own middle is under the Talk button.
- scrollUntilVisible:
    element: "Work, pool"
    direction: DOWN
    centerElement: true
- tapOn: "Work, pool"
- extendedWaitUntil:
    visible: ".*OPUS 4.6.*"
    timeout: 5000
- assertVisible: "Weekly window usage"
- assertVisible: "5-hour window usage"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-work-expanded
# The last line sits below the fold on the iPhone.
- scrollUntilVisible:
    element: "The main accounts can switch to this account"
    direction: DOWN
# Back to the top: the row can count as "visible" while it sits under the header.
- scrollUntilVisible:
    element: "storefront"
    direction: UP
# Android leaves the open row under the Talk button here. iOS leaves its header
# clear of it, and there the open row's middle is its detail, which doesn't close it.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "Work, pool"
          direction: DOWN
          centerElement: true
- tapOn: "Work, pool"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "The main accounts can switch to this account"
