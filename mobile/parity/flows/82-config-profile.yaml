appId: cx.lpm.mobile
name: 82-config-profile
tags: [demo, config]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
# The project's "…" menu; tap Configure… once it has settled.
- tapOn: "More"
- extendedWaitUntil:
    visible: "Review Changes.*"
    timeout: 5000
- runFlow: subflows/scroll-project-menu.yaml
# Under load iOS can drop a tap on a menu that's still settling; tap again if so.
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Configure…"
      - extendedWaitUntil:
          visible: "Configuration"
          timeout: 5000
# A new profile: a name and the services it starts.
- tapOn: "Add Profile"
- extendedWaitUntil:
    visible: "Starting this profile runs exactly these services."
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-add-profile
- tapOn: "Name"
- inputText: "frontend"
- tapOn: "web"
- tapOn: "api"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2-picked
- tapOn: "Save"
- extendedWaitUntil:
    visible: "2 services"
    timeout: 5000
- assertVisible: "frontend"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 3-saved
# Editing it offers Delete, behind a confirmation.
- tapOn: "frontend"
- extendedWaitUntil:
    visible: "Edit Profile"
    timeout: 5000
- tapOn: "Delete profile"
- extendedWaitUntil:
    visible: "Delete this profile?"
    timeout: 5000
- takeScreenshot: 4-confirm-delete
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Edit Profile"
    timeout: 5000
- extendedWaitUntil:
    notVisible: "frontend"
    timeout: 5000
