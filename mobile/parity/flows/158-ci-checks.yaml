# CI in the project's "…" menu, under Git: storefront's pull request has a failing
# test, so the row says 1 failing; its sheet lists the checks failing first, and
# running the failed jobs again shows them running, then passing. iOS names the row
# "CI, 1 failing"; Android may read its title and subtitle apart. The project's Git
# section reads "CI on #42, 1 failing" behind the menu, which these don't match.
appId: cx.lpm.mobile
name: 158-ci-checks
tags: [demo, projects, git]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
- tapOn: "More"
- extendedWaitUntil:
    visible: "CI, 1 failing|1 failing"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-menu
- tapOn: "CI, 1 failing|1 failing"
- extendedWaitUntil:
    visible: "test \\(ubuntu-latest\\)"
    timeout: 5000
- assertVisible: "Re-run failed jobs"
- assertVisible: "Open checks on GitHub"
- assertVisible: "Two-step checkout flow"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2-sheet
- tapOn: "Re-run failed jobs"
- extendedWaitUntil:
    notVisible: "Re-run failed jobs"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 3-running
- tapOn: "Done"
- tapOn: "More"
- extendedWaitUntil:
    visible: "CI, 1 running|1 running"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 4-menu-running
- extendedWaitUntil:
    visible: "CI, Checks passed|Checks passed"
    timeout: 70000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 5-passed
