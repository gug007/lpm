appId: cx.lpm.mobile
name: 46-notification-settings
tags: [demo, settings]
---
- runFlow: subflows/enter-demo.yaml
- runFlow: subflows/open-more-menu.yaml
- tapOn: "Settings.*"
- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000
- tapOn: "Notifications"
- extendedWaitUntil:
    visible: "Push notifications"
    timeout: 5000
- assertVisible: "Waiting for you"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-notification-settings
- scrollUntilVisible:
    element: "Quiet hours"
    direction: DOWN
- assertVisible: "Only when it needs me: an agent waiting on you, or an automation asking a question."
- assertVisible: "storefront"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2-projects-quiet-hours
- scrollUntilVisible:
    element: "Error or timeout"
    direction: DOWN
- scrollUntilVisible:
    element: "Mondays, when your week in lpm is ready"
    direction: DOWN
- assertVisible: "Weekly recap"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 3-weekly-recap
