appId: cx.lpm.mobile
name: 159-composer-dictate
tags: [demo, terminal, composer]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Terminal 1"
    timeout: 5000
- tapOn: "Terminal 1"
- extendedWaitUntil:
    visible: "Message"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-mic-in-send-seat
- tapOn: "Dictate"
- extendedWaitUntil:
    visible: "Stop and insert"
    timeout: 5000
- extendedWaitUntil:
    visible: "Run the tests.*"
    timeout: 5000
- takeScreenshot: 2-recording
- tapOn: "Stop and insert"
- extendedWaitUntil:
    notVisible: "Stop and insert"
    timeout: 5000
- extendedWaitUntil:
    visible: "Run the tests and fix anything that fails.*"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 3-words-in-field
- tapOn: "Dictate"
- extendedWaitUntil:
    visible: "Stop and insert"
    timeout: 5000
- takeScreenshot: 4-adding-to-a-prompt
- tapOn: "Cancel dictation"
- extendedWaitUntil:
    visible: "Send"
    timeout: 5000
- assertVisible: "Dictate"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Dictate"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 5-mic-back-after-send
