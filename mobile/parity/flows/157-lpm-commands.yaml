# lpm skills: a project's Skills screen (this project's folders, a new folder),
# the skill editor, a folder inside that folder, then the composer's "/" menu with the commands run most,
# the user's skills and the agent's own side by side, ahead of the rest A–Z.
appId: cx.lpm.mobile
name: 157-lpm-commands
tags: [demo, commands, composer]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
- tapOn: "More"
- extendedWaitUntil:
    visible: "Skills"
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Skills"
      - extendedWaitUntil:
          visible: "Review"
          timeout: 5000
- assertVisible: "This project"
- assertVisible: "Bugs"
- assertVisible: "No folder"
- assertVisible: "Other skills"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-commands
- tapOn: "New folder"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Docs"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Docs"
    timeout: 5000
- tapOn: "New skill"
- extendedWaitUntil:
    visible: "Save"
    timeout: 5000
- assertVisible: "Cancel"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2-editor
- scrollUntilVisible:
    element: "Keep out of Git"
    direction: DOWN
- assertVisible: "Never committed. Syncs to your connected computers."
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Save"
    timeout: 5000
- tapOn: "Docs"
- extendedWaitUntil:
    visible: "New folder"
    timeout: 5000
- tapOn: "New folder"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Guides"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Guides"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2b-subfolder
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Claude"
    timeout: 5000
- tapOn: "Claude"
- extendedWaitUntil:
    visible: "Add Apple Pay as a payment option in the new checkout flow"
    timeout: 10000
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Message"
    timeout: 5000
- tapOn: "Message"
- inputText: "/"
- extendedWaitUntil:
    visible: "/review-changes"
    timeout: 5000
- assertVisible: "MOST USED"
- assertVisible: "/commit-parts"
- assertVisible: "/compact"
- assertVisible: "Manage skills"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 3-slash-menu
