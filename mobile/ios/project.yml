# XcodeGen spec — turns the Swift sources here into a runnable iOS app.
#
#   brew install xcodegen        # once
#   mobile/ios/open.sh           # sets your signing team, regenerates, opens Xcode
#                                # and runs on your iPhone
#
# Run on a physical iPhone (the Simulator can't reach your Mac's LAN/tailnet).
name: LpmMobile
options:
  bundleIdPrefix: cx.lpm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM, from the untracked Team.xcconfig that team.sh writes.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

targets:
  LpmMobile:
    type: application
    platform: iOS
    # A shared scheme, so run.sh/deploy.sh don't depend on Xcode autocreating one
    # (it won't once its per-user state has suppressed autocreation).
    scheme: {}
    sources:
      - Assets.xcassets
      - Sources/LpmMobile
      # Push-key + crypto shared with the notification service extension (the same
      # files are compiled into both targets).
      - Sources/Shared
      # Apple privacy manifest — copied into the app bundle root so App Store
      # uploads pass required-reason-API validation (ITMS-91053).
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      # xterm.js + the terminal host page, copied into the app bundle as a
      # preserved folder ("web/") so the WKWebView loads them offline with their
      # relative paths (xterm/xterm.js …) intact.
      - path: ../shared/web
        type: folder
      # Demo Mode's sample files, shared with the Android demo so both describe the
      # same attachments.
      - path: ../shared/demo
        type: folder
    # Built-in Tailscale: the Go node in ../../tailnet/ios, compiled by
    # build-tailnet.sh into a static library for the SDK being built and imported
    # into Swift as the LpmTailnet module. Needs Go (`brew install go`).
    preBuildScripts:
      - name: Build built-in Tailscale
        script: '"$SRCROOT/build-tailnet.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cx.lpm.mobile
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../tailnet/ios/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(DERIVED_FILE_DIR)/tailnet
        # build-tailnet.sh runs the Go toolchain, which reads and writes its
        # caches outside the project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.73"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Automatic signing, team-agnostic so this file stays portable: the team
        # comes from Signing.xcconfig (see configFiles above).
        CODE_SIGN_STYLE: Automatic
    # aps-environment lets the app receive APNs pushes (distribution signing
    # rewrites `development` to `production`). The shared keychain access group lets
    # the notification service extension read the push key. The app group holds the
    # Agents widget's rows, written by the app and the notification extension.
    entitlements:
      path: LpmMobile.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)cx.lpm.mobile.shared
        com.apple.security.application-groups:
          - group.cx.lpm.mobile
    dependencies:
      # Embed the notification service extension as a plugin so pushes get decrypted
      # and rewritten on-device.
      - target: LpmMobileNotificationService
        embed: true
      - target: LpmMobileWidgets
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: lpm
        # A tapped Agents widget row opens its terminal through an lpmlink:// URL.
        CFBundleURLTypes:
          - CFBundleURLName: cx.lpm.mobile
            CFBundleURLSchemes:
              - lpmlink
        # Wake the app for silent background pushes that withdraw delivered
        # notifications (agent status cleared on the Mac). `audio` keeps read-aloud
        # speaking with the screen locked — the point of reading a result out loud.
        UIBackgroundModes:
          - remote-notification
          - audio
        # The live Mac's agents on the Lock Screen and in the Dynamic Island,
        # updated by the Mac through the push relay while the app is away.
        NSSupportsLiveActivities: true
        # Export compliance: standard TLS (wss://) for transport, plus OS-provided
        # primitives (the Keychain and CryptoKit: SHA-256 cert pinning and AES-GCM
        # push-payload decryption). The built-in Tailscale node (liblpmtailnet.a)
        # also carries its own standard WireGuard, Noise and TLS code, not Apple's,
        # so confirm this answer in App Store Connect before shipping it.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad must support all four orientations to satisfy App Store multitasking
        # validation (error 90474). iPhone keeps three (no upside-down).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required — the QR scanner crashes on open without a camera usage string.
        NSCameraUsageDescription: Scan the pairing QR code shown by lpm on your Mac.
        # The share sheet's Save Image (the weekly recap card) saves nothing without it.
        NSPhotoLibraryAddUsageDescription: Save images you share from lpm, like your weekly recap, to Photos.
        NSLocalNetworkUsageDescription: Connect to lpm running on your Mac.
        NSFaceIDUsageDescription: Unlock lpm Link and confirm actions that are hard to undo, when you turn that on in Settings.
        NSBonjourServices:
          - _lpm._tcp
        # ATS only implicitly exempts local/CGNAT addresses, so a Linux host on a
        # public IP fails ATS's system trust check before our pinning delegate is
        # ever consulted ("ATS failed system trust", error -1200) — exception
        # domains can't name IPs, so the global opt-out is the only plist lever.
        # Transport security still holds: every connection is wss:// and the app
        # pins each machine's certificate (TOFU) in the trust delegate.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  # Notification service extension: decrypts a push payload on-device and rewrites
  # the notification with the real project/terminal/status. Its bundle id must be
  # prefixed by the app's, and it shares the push key via the same keychain group.
  LpmMobileNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - Sources/NotificationService
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cx.lpm.mobile.notificationservice
        MARKETING_VERSION: "1.73"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: LpmMobileNotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)cx.lpm.mobile.shared
        com.apple.security.application-groups:
          - group.cx.lpm.mobile
    info:
      path: NotificationService-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: lpm
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # Home Screen widgets: Agents, Usage and Token activity, read from the app group
  # the app and the notification extension write — and the agents' Live Activity,
  # whose sealed content needs the push key: the shared keychain group, or the
  # copy the app keeps in the app group, since drawing it can't reach the Keychain.
  LpmMobileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Widgets
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cx.lpm.mobile.widgets
        MARKETING_VERSION: "1.73"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: LpmMobileWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)cx.lpm.mobile.shared
        com.apple.security.application-groups:
          - group.cx.lpm.mobile
    info:
      path: Widgets-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: lpm
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
